[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    unit: Fast unit tests without database IO
    integration: Integration tests with SQLite/Postgres
    rag: Retrieval-Augmented Generation tests
