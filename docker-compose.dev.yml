version: '3.8'

# Development overrides for local hot-reloading
services:
  api:
    command: ["uvicorn", "doc_assistant.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - .:/app
      - uploads_data:/app/uploads

  worker:
    volumes:
      - .:/app
      - uploads_data:/app/uploads
